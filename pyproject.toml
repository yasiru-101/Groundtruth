[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "groundtruth"
version = "0.1.0"
description = "An autonomous multi-agent system that keeps a Jira board honest."
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.6",
    "httpx>=0.27",
    "pyyaml>=6",
    "python-dotenv>=1.0",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-json-report>=1.5",
]

[project.scripts]
groundtruth = "groundtruth.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/groundtruth"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v"
